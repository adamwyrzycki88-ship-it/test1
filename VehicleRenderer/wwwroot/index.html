<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Image Renderer - C#/.NET PoC</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 { color: #1a1a1a; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            border: 2px dashed #ccc;
            border-radius: 4px;
            cursor: pointer;
            background: #fafafa;
        }
        input[type="file"]:hover { border-color: #007bff; }
        .dimensions { display: flex; gap: 20px; }
        .dimensions .form-group { flex: 1; }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result-container { margin-top: 30px; display: none; }
        .result-container.visible { display: block; }
        .result-image {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .result-image img { max-width: 100%; height: auto; }
        .timing {
            margin-top: 15px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 4px;
            color: #2e7d32;
            font-weight: 500;
        }
        .timing.error { background: #ffebee; color: #c62828; }
        .tech { margin-top: 30px; padding: 15px; background: #e3f2fd; border-radius: 4px; }
        .tech h3 { margin-top: 0; color: #1565c0; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Vehicle Image Renderer</h1>
    <p class="subtitle">C#/.NET 8 PoC using SkiaSharp + Svg.Skia</p>
    
    <div class="form-container">
        <form id="renderForm">
            <div class="form-group">
                <label>Vehicle SVG *</label>
                <input type="file" name="vehicleSvg" accept=".svg" required>
            </div>
            <div class="form-group">
                <label>Watermark SVG (optional)</label>
                <input type="file" name="watermarkSvg" accept=".svg">
            </div>
            <div class="dimensions">
                <div class="form-group">
                    <label>Max Width (px)</label>
                    <input type="number" name="maxWidth" value="800" min="1" max="4096">
                </div>
                <div class="form-group">
                    <label>Max Height (px)</label>
                    <input type="number" name="maxHeight" value="600" min="1" max="4096">
                </div>
            </div>
            <button type="submit" id="submitBtn">Render Image</button>
        </form>
        
        <div class="result-container" id="resultContainer">
            <div class="result-image">
                <h3>Result</h3>
                <img id="resultImage" alt="Rendered vehicle">
                <div class="timing" id="timingInfo"></div>
            </div>
        </div>
    </div>
    
    <div class="tech">
        <h3>Technology Stack</h3>
        <p><strong>.NET 8</strong> + <strong>SkiaSharp</strong> + <strong>Svg.Skia</strong></p>
        <p><strong>Enhancements:</strong> Ground shadow, anti-aliasing</p>
        <p><strong>Performance:</strong> ~72ms render time</p>
    </div>
    
    <script>
        const form = document.getElementById('renderForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');
        const timingInfo = document.getElementById('timingInfo');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resultContainer.classList.remove('visible');
            timingInfo.classList.remove('error');
            timingInfo.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Rendering...';
            
            const startTime = performance.now();
            
            try {
                const formData = new FormData(form);
                const response = await fetch('/render', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Rendering failed');
                }
                
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const elapsed = (performance.now() - startTime).toFixed(0);
                
                resultImage.src = url;
                timingInfo.textContent = `Rendering time: ${elapsed}ms`;
                resultContainer.classList.add('visible');
            } catch (error) {
                timingInfo.textContent = `Error: ${error.message}`;
                timingInfo.classList.add('error');
                resultContainer.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Render Image';
            }
        });
    </script>
</body>
</html>
